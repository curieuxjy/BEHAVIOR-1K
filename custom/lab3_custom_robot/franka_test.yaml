      ag_end_points: [["link22", [0.006, 0.04, 0.003]], ["link32", [0.006, 0.045, 0.003]], ["link42", [0.006, 0.04, 0.003]], ["link52", [0.006, 0.04, 0.003]]]
      not_support_urdf: true
